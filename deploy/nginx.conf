# 微信公众号服务器配置要求：必须是 80(http) 或 443(https) 端口
# 所以对外用 Nginx 监听 443，内部反代到 127.0.0.1:8000
#
# 证书申请：sudo certbot --nginx -d wx.example.com

server {
    listen 80;
    server_name wx.example.com;
    # 微信服务器只会访问 80/443，80 建议直接跳转到 https
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    # nginx >= 1.25.1 用这一行代替上面的 listen，并删掉旧写法里的 http2
    # listen 443 ssl;  http2 on;
    server_name wx.example.com;

    ssl_certificate     /etc/letsencrypt/live/wx.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wx.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/wechat-deepseek.access.log;
    error_log  /var/log/nginx/wechat-deepseek.error.log;

    # 微信消息很小，但客服消息推送是出站请求，这里限制入站体积即可
    client_max_body_size 1m;

    location /wechat {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 关键：微信只等 5 秒，Nginx 不要比它更有耐心，也不要缓冲响应
        proxy_connect_timeout 3s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;
        proxy_buffering       off;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    location / {
        return 404;
    }
}
